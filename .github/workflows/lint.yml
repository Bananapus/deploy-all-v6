name: lint
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  forge-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0

      - name: Check formatting
        run: forge fmt --check

      # Runs start_anvil against a stub to check its exact arguments, then checks no script line
      # launches anvil directly (a convention check; the function is the one launch path).
      - name: Check script Anvils keep state off disk
        run: |
          stub=$(mktemp -d); printf '#!/bin/sh\necho "$*"\n' > "$stub/anvil"; chmod +x "$stub/anvil"
          eval "$(grep -E '^start_anvil\(\) ' script/rehearse-addresses.sh)"
          test "$(PATH="$stub:$PATH" start_anvil --silent)" = "--prune-history 500 --silent"
          test "$(grep -rEn --include='*.sh' '(^|[;&|({])[[:space:]]*anvil[[:space:]]' script | wc -l)" -eq 1
